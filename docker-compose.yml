version: "3.8"

services:
  ccp-proxy:
    image: ghcr.io/cnstark/cc-proxy:latest
    container_name: ccp-proxy
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ${HOME}/.cc_proxy:/root/.cc_proxy
    restart: unless-stopped
    environment:
      - CC_PROXY_CONFIG=/root/.cc_proxy/config.yaml
      # Docker 端口映射通过 veth 网桥连接，容器内必须监听 0.0.0.0
      - CC_PROXY_LISTEN=0.0.0.0:8787
